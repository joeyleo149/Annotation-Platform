services:
  # 1. SQL Server Container (Replaces local SQL Express)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourPassword123!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourPassword123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

 

  # 2. ASP.NET Core Backend + Swagger
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dotnet_backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=KitScenesAnnotationDb;User Id=sa;Password=YourPassword123!;Encrypt=True;TrustServerCertificate=True;
    ports:
      - "5000:5138"
    depends_on:
      sqlserver:
        condition: service_healthy # Wait for SQL Server to accept connections

  # 3. Python Service / Scripts
  python_service:
    build:
      context: ./backend
      dockerfile: Dockerfile.python # Dedicated Dockerfile for Python scripts
    container_name: python_scripts
    restart: "no" # Prevents Docker from restarting the container after seeding completes
    environment:
      - ANNOTATION_DB_CONNECTION=DRIVER={ODBC Driver 18 for SQL Server};SERVER=sqlserver,1433;DATABASE=KitScenesAnnotationDb;UID=sa;PWD=YourPassword123!;TrustServerCertificate=yes;
    depends_on:
      sqlserver:
        condition: service_healthy # Wait for SQL Server to accept connections

  # 4. React + Vite + Tailwind Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vite_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mssql_data: