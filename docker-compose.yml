services:
  # 1. SQL Server database (portable — no host install required)
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourPassword123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 2. ASP.NET Core Backend + Swagger
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dotnet_backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=KitScenesAnnotationDb;User Id=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;
    ports:
      - "5000:5138"
    volumes:
      - backend_storage:/app/Storage
    depends_on:
      db:
        condition: service_healthy

  # 3. React + Vite + Tailwind Frontend (served by nginx, proxies /api to backend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vite_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # 4. Optional one-shot DB seeder (development sample data).
  #    Disabled by default so it can never break `docker compose up`.
  #    Run explicitly with:  docker compose --profile seed run --rm python_service
  python_service:
    build:
      context: ./backend
      dockerfile: Dockerfile.python
    container_name: python_scripts
    profiles: ["seed"]
    restart: "no"
    environment:
      - ANNOTATION_DB_CONNECTION=DRIVER={ODBC Driver 18 for SQL Server};SERVER=db;DATABASE=KitScenesAnnotationDb;UID=sa;PWD=YourPassword123!;TrustServerCertificate=yes;
    depends_on:
      db:
        condition: service_healthy

volumes:
  mssql_data:
  backend_storage:
